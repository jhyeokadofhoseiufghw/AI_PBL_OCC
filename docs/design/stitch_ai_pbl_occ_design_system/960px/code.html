<style>
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    /* Seat Checkbox Magic */
    .seat-checkbox {
        appearance: none;
        margin: 0;
    }
    .seat-label {
        width: 2.5rem;
        height: 2.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
    }
    
    .seat-label::before {
        content: '';
        position: absolute;
        inset: 0;
        background: currentColor;
        opacity: 0;
        transition: opacity 0.2s;
    }
    
    .seat-checkbox:not(:checked):not(:disabled) + .seat-label:hover {
        transform: translateY(-4px) scale(1.05);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        z-index: 10;
    }

    .seat-checkbox:not(:checked):not(:disabled) + .seat-label:hover::before {
        opacity: 0.05;
    }

    .seat-checkbox:checked + .seat-label {
        background-color: var(--color-primary);
        color: var(--color-on-primary);
        border-color: transparent;
        transform: scale(1.1) translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(91, 33, 182, 0.4);
        z-index: 20;
    }
    
    .seat-checkbox:checked + .seat-label::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
        opacity: 0;
        animation: ping-once 0.5s cubic-bezier(0, 0, 0.2, 1);
    }
    
    .seat-checkbox:disabled + .seat-label {
        background-color: var(--color-surface-dim);
        border-color: transparent;
        color: var(--color-on-surface-variant);
        opacity: 0.4;
        cursor: not-allowed;
    }

    @keyframes ping-once {
        0% { transform: scale(0.5); opacity: 1; }
        100% { transform: scale(2); opacity: 0; }
    }
    
    /* Utilities */
    .no-scrollbar::-webkit-scrollbar {
        display: none;
    }
    .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const rows = ['A', 'B', 'C', 'D'];
        const cols = 12;
        const seatMap = document.getElementById('seat-map');
        const pricePerSeat = 35000; // ₩35,000
        
        // Mock booked seats
        const bookedSeats = ['A-4', 'A-5', 'B-7', 'C-1', 'C-2', 'D-9', 'D-10'];

        // Generate Grid
        rows.forEach((row, rIndex) => {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'flex items-center gap-6 snap-center';
            rowDiv.style.animation = `fadeIn 0.4s ease-out ${rIndex * 0.1}s both`;
            
            // Row Label
            const label = document.createElement('div');
            label.className = 'w-6 text-label-caps text-on-surface-variant font-body-bold text-center';
            label.textContent = row;
            rowDiv.appendChild(label);

            // Seats
            const seatsContainer = document.createElement('div');
            seatsContainer.className = 'flex gap-3';
            
            // create gap in middle (aisle)
            for (let c = 1; c <= cols; c++) {
                const seatId = `${row}-${c}`;
                const isBooked = bookedSeats.includes(seatId);
                
                const seatWrapper = document.createElement('div');
                if (c === 7) {
                    seatWrapper.className = 'ml-8 relative'; // Aisle
                } else {
                    seatWrapper.className = 'relative';
                }

                const input = document.createElement('input');
                input.type = 'checkbox';
                input.id = seatId;
                input.className = 'seat-checkbox absolute opacity-0 w-0 h-0';
                input.disabled = isBooked;
                input.value = seatId;
                
                const seatLabel = document.createElement('label');
                seatLabel.htmlFor = seatId;
                seatLabel.className = `seat-label bg-surface border border-outline-variant text-label-caps ${isBooked ? '' : 'text-primary'}`;
                seatLabel.textContent = c;

                seatWrapper.appendChild(input);
                seatWrapper.appendChild(seatLabel);
                seatsContainer.appendChild(seatWrapper);
                
                // Event listener for selection
                input.addEventListener('change', updateSelection);
            }
            
            rowDiv.appendChild(seatsContainer);
            seatMap.appendChild(rowDiv);
        });

        // Handle Selection Logic
        const selectedSeatsContainer = document.getElementById('selected-seats-container');
        const emptyState = document.getElementById('empty-state');
        const totalAmountEl = document.getElementById('total-amount');

        function updateSelection() {
            const selectedInputs = document.querySelectorAll('.seat-checkbox:checked');
            const selectedIds = Array.from(selectedInputs).map(input => input.value);
            
            // Update Badges
            selectedSeatsContainer.innerHTML = '';
            
            if (selectedIds.length === 0) {
                selectedSeatsContainer.appendChild(emptyState);
                emptyState.textContent = 'Select seats';
                emptyState.className = 'inline-flex items-center justify-center px-4 py-2 bg-primary/10 text-primary rounded-full text-table-cell font-body-bold animate-pulse';
                totalAmountEl.textContent = `₩100,000`;
            } else {
                selectedIds.forEach((id, index) => {
                    const badge = document.createElement('span');
                    // Format id from A-1 to A열 1번
                    const [row, num] = id.split('-');
                    const formatted = `${row}열 ${num}번`;
                    
                    badge.className = 'inline-flex items-center justify-center px-4 py-2 bg-primary text-on-primary rounded-full text-table-cell font-body-bold shadow-sm shadow-primary/30';
                    badge.style.animation = `slideUp 0.3s ease-out ${index * 0.05}s both`;
                    badge.textContent = formatted;
                    selectedSeatsContainer.appendChild(badge);
                });
                // Update Total
                const total = selectedIds.length * pricePerSeat;
                
                // Animate number change (simple version)
                totalAmountEl.style.transform = 'scale(1.1)';
                totalAmountEl.style.color = 'var(--color-primary-container)';
                setTimeout(() => {
                    totalAmountEl.textContent = `₩${total.toLocaleString()}`;
                    totalAmountEl.style.transform = 'scale(1)';
                    totalAmountEl.style.color = 'var(--color-primary)';
                }, 150);
            }
        }
    });
</script></main>
