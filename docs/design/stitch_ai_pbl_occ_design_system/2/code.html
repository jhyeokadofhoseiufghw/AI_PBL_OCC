<style>
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
        .seat-cell {
            width: 28px;
            height: 28px;
            margin: 2px;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            color: transparent;
            transition: all 0.1s ease;
            box-sizing: border-box;
        }
        .seat-cell:hover {
            transform: scale(1.1);
            z-index: 10;
        }
        .seat-active {
            background-color: var(--color-surface-container-high);
            border: 1px solid var(--color-outline-variant);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.5);
        }
        .seat-active.selected {
            background-color: var(--color-secondary-container);
            border-color: var(--color-secondary);
        }
        .seat-aisle {
            background-color: transparent;
            border: 1px dashed var(--color-outline-variant);
            opacity: 0.3;
        }
        .seat-aisle:hover {
            background-color: var(--color-surface-variant);
            opacity: 0.8;
        }
    </style>
<script>
        let currentTool = 'seat';
        let isDragging = false;
        let gridScale = 1;
        let matrixData = [];
        let rows = 10;
        let cols = 15;

        function setTool(tool) {
            currentTool = tool;
            document.getElementById('tool-seat').className = `flex-1 py-2 rounded-full ${tool === 'seat' ? 'bg-[#5b21b6] text-on-secondary shadow-sm' : 'text-on-surface-variant hover:bg-surface-variant'} text-body-bold transition-all flex items-center justify-center gap-xs`;
            document.getElementById('tool-aisle').className = `flex-1 py-2 rounded-md ${tool === 'aisle' ? 'bg-[#5b21b6] text-on-secondary shadow-sm rounded-full' : 'text-on-surface-variant hover:bg-surface-variant rounded-full'} text-body-bold transition-all flex items-center justify-center gap-xs`;
        }

        function updateGrid(axis, delta) {
            const input = document.getElementById(`${axis}-input`);
            let val = parseInt(input.value) + delta;
            if (val < 1) val = 1;
            if (val > 50) val = 50;
            input.value = val;
        }

        function generateGrid() {
            rows = parseInt(document.getElementById('row-input').value);
            cols = parseInt(document.getElementById('col-input').value);
            
            document.getElementById('grid-size').innerHTML = `${rows}<span class="text-body-base text-outline-variant font-normal mx-1">x</span>${cols}`;
            
            const container = document.getElementById('seat-matrix');
            container.innerHTML = '';
            
            matrixData = [];
            let totalSeats = 0;

            for (let r = 0; r < rows; r++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'flex flex-nowrap gap-[4px]';
                const rowData = [];
                
                for (let c = 0; c < cols; c++) {
                    const seat = document.createElement('div');
                    seat.className = 'seat-cell seat-active';
                    seat.dataset.r = r;
                    seat.dataset.c = c;
                    
                    const rowChar = String.fromCharCode(65 + (r % 26)); 
                    seat.title = `${rowChar}-${c+1}`;

                    seat.addEventListener('mousedown', (e) => {
                        isDragging = true;
                        handleSeatInteraction(e, seat);
                    });
                    seat.addEventListener('mouseenter', (e) => { 
                        if(isDragging) handleSeatInteraction(e, seat); 
                    });
                    
                    rowDiv.appendChild(seat);
                    rowData.push({ active: true, label: `${rowChar}-${c+1}` });
                    totalSeats++;
                }
                container.appendChild(rowDiv);
                matrixData.push(rowData);
            }
            
            updateSummary(totalSeats);
            resetZoom();
        }

        document.addEventListener('mouseup', () => { isDragging = false; });

        function handleSeatInteraction(e, seatElement) {
            e.preventDefault();
            const r = parseInt(seatElement.dataset.r);
            const c = parseInt(seatElement.dataset.c);
            
            if (currentTool === 'seat') {
                seatElement.className = 'seat-cell seat-active';
                matrixData[r][c].active = true;
            } else {
                seatElement.className = 'seat-cell seat-aisle';
                matrixData[r][c].active = false;
            }
            recalculateSummary();
        }

        function recalculateSummary() {
            let count = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (matrixData[r][c].active) count++;
                }
            }
            updateSummary(count);
        }

        function updateSummary(count) {
            document.getElementById('total-seats').innerText = count;
        }

        function zoomGrid(delta) {
            gridScale += delta;
            if (gridScale < 0.2) gridScale = 0.2;
            if (gridScale > 3) gridScale = 3;
            document.getElementById('seat-matrix').style.transform = `scale(${gridScale})`;
        }

        function resetZoom() {
            gridScale = 1;
            document.getElementById('seat-matrix').style.transform = `scale(${gridScale})`;
        }
</script>
